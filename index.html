<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
    <title>HUB FINANCEIRO | Painel de ferramentas</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #0d0f17;
            --bg2:     #141720;
            --bg3:     #1a1e2b;
            --border:  #2a2e3f;
            --text:    #e1e3ef;
            --text2:   #9a9eb8;
            --text3:   #5c6080;
            --gold:    #f5c842;
            --amber:   #e0ac2c;
            --green:   #2ecc71;
            --red:     #e74c3c;
            --blue:    #4a9eff;
            --sidebar-w: 260px;
            --sidebar-collapsed: 56px;
        }
        body.light {
            --bg:    #f4f5f7; --bg2: #ffffff; --bg3: #eef0f4;
            --border:#d4d8e2; --text: #1a1d2e; --text2: #4a4f6a;
            --text3: #8a90a8; --gold: #b8860b; --amber: #c47d00;
        }

        body {
            background: var(--bg); font-family: 'DM Sans', sans-serif;
            color: var(--text); height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; transition: background .2s, color .2s;
        }

        /* ── Topbar unificada ── */
        .topbar {
            height: 54px; flex-shrink: 0;
            background: var(--bg2); border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0 1.2rem; gap: 16px;
            z-index: 100; position: relative;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .topbar-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            pointer-events: none;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .pbf-badge {
            padding: 0 12px; height: 30px; background: var(--gold);
            border-radius: 40px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; color: #000; letter-spacing: .5px;
            flex-shrink: 0;
        }
        .topbar-title {
            font-size: 14px; font-weight: 600; color: var(--text);
            white-space: nowrap; 
        }
        .topbar-back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            background: transparent; border: 1px solid var(--border);
            border-radius: 8px; color: var(--text2);
            font-family: inherit; font-size: 12px; font-weight: 500;
            padding: 5px 10px; cursor: pointer; transition: .2s;
            white-space: nowrap;
        }
        .topbar-back-btn:hover {
            border-color: var(--amber); color: var(--gold);
            background: var(--bg3);
        }
        .topbar-back-btn .material-symbols-outlined { font-size: 16px; }
        .active-tool-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.2px;
            white-space: nowrap;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }
        .topbar-new-btn {
            display: inline-flex; align-items: center; gap: 5px;
            background: transparent; border: 1px solid var(--border);
            border-radius: 8px; color: var(--text3);
            font-family: inherit; font-size: 11px; font-weight: 500;
            padding: 5px 10px; cursor: pointer; transition: .15s;
            white-space: nowrap;
        }
        .topbar-new-btn:hover {
            border-color: var(--amber); color: var(--gold);
            background: var(--bg3);
        }
        .topbar-new-btn .material-symbols-outlined { font-size: 14px; }
        .topbar-clock { 
            font-size: 11px; color: var(--text3); white-space: nowrap; 
            font-variant-numeric: tabular-nums;
            background: var(--bg3); padding: 4px 10px; border-radius: 30px;
        }
        .theme-btn {
            background: var(--bg3); border: 1px solid var(--border);
            border-radius: 30px; width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; transition: border-color .2s;
            flex-shrink: 0;
        }
        .theme-btn:hover { border-color: var(--gold); }

        @media (max-width: 680px) {
            .topbar-back-btn span:not(.material-symbols-outlined) { display: none; }
            .topbar-new-btn span:not(.material-symbols-outlined) { display: none; }
            .topbar-back-btn { padding: 5px 8px; }
            .topbar-new-btn { padding: 5px 8px; }
            .active-tool-name { font-size: 13px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
            .topbar-clock { font-size: 10px; padding: 4px 6px; }
            .topbar-title { font-size: 12px; }
        }
        @media (max-width: 520px) {
            .topbar-title { display: none; }
            .active-tool-name { max-width: 110px; }
        }
        @media (max-width: 480px) {
            .topbar-center { position: static; transform: none; left: auto; margin: 0 auto; }
            .topbar { flex-wrap: wrap; justify-content: center; height: auto; padding: 8px; gap: 8px; }
            .topbar-left, .topbar-right { flex: 1; }
            .topbar-center { order: 2; width: 100%; text-align: center; margin-top: 4px; }
        }

        /* ── LAYOUT PRINCIPAL ── */
        .layout { display: flex; flex: 1; overflow: hidden; }

        /* ===== SIDEBAR - IGUAL AO PRINT (sem amarelo nos títulos) ===== */
        .sidebar {
            width: var(--sidebar-collapsed);
            flex-shrink: 0;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width .28s ease;
            overflow: hidden;
            z-index: 50;
            position: relative;
        }
        .sidebar:hover {
            width: var(--sidebar-w);
            box-shadow: 6px 0 24px rgba(0,0,0,.4);
        }

        /* Títulos das seções no estilo do print: tom neutro (não amarelo) */
        .nav-section-label {
            font-size: 08px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text2);      /* cor neutra clara, como no print */
            padding: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            white-space: nowrap;
            transition: all .2s ease;
            margin-top: 8px;
        }
        /* Quando a sidebar expandir (hover ou mobile) */
        .sidebar:hover .nav-section-label,
        .sidebar.mobile-open .nav-section-label {
            padding: 12px 16px 6px;
            height: auto;
            opacity: 1;
        }

        /* Itens de navegação */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0;
            padding: 11px 0;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text2);
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all .2s ease;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
        }
        .nav-item:hover {
            background: var(--bg3);
            color: var(--text);
        }
        .nav-item.active {
            border-left-color: var(--amber);
            background: var(--bg3);
            color: var(--gold);
            font-weight: 600;
        }
        .nav-item .material-symbols-outlined {
            font-size: 20px;
            flex-shrink: 0;
            min-width: 56px;
            text-align: center;
        }
        .sidebar:hover .nav-item,
        .sidebar.mobile-open .nav-item {
            justify-content: flex-start;
            padding: 11px 0;
            gap: 0;
        }
        .nav-item-label {
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            transition: opacity .2s ease, max-width .28s ease;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            display: inline-block;
        }
        .sidebar:hover .nav-item-label,
        .sidebar.mobile-open .nav-item-label {
            opacity: 1;
            max-width: 220px;
        }

        /* Footer do sidebar (avatar + nome) */
        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            overflow: hidden;
            transition: all .2s ease;
        }
        .sidebar:hover .sidebar-footer,
        .sidebar.mobile-open .sidebar-footer {
            gap: 12px;
            padding: 12px 16px;
            justify-content: flex-start;
        }
        .sidebar-footer img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .sidebar-footer .user-info {
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            transition: opacity .2s ease, max-width .28s ease;
        }
        .sidebar:hover .sidebar-footer .user-info,
        .sidebar.mobile-open .sidebar-footer .user-info {
            opacity: 1;
            max-width: 180px;
        }
        .sidebar-footer .user-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
        }
        .sidebar-footer .user-role {
            font-size: 11px;
            color: var(--text3);
            white-space: nowrap;
        }

        /* Responsivo mobile */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 54px;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
                width: 260px !important;
                box-shadow: 4px 0 20px rgba(0,0,0,.4);
                transition: transform .25s ease !important;
            }
            .sidebar:hover { width: 260px; box-shadow: none; }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            .sidebar.mobile-open .nav-item {
                justify-content: flex-start;
            }
            .sidebar.mobile-open .nav-item-label {
                opacity: 1;
                max-width: 200px;
            }
            .sidebar.mobile-open .nav-section-label {
                padding: 12px 16px 6px;
                height: auto;
                opacity: 1;
            }
            .sidebar.mobile-open .sidebar-footer {
                padding: 12px 16px;
                justify-content: flex-start;
                gap: 12px;
            }
            .sidebar.mobile-open .sidebar-footer .user-info {
                opacity: 1;
                max-width: 160px;
            }
            .sidebar-overlay {
                display: block !important;
            }
            .topbar-clock {
                display: none;
            }
        }

        /* ── MAIN / WELCOME (inalterado) ── */
        .main-content { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        #welcome-screen {
            position: absolute; inset: 0; overflow-y: auto;
            background: var(--bg); display: flex; flex-direction: column;
            align-items: center; padding: 40px 24px; z-index: 10;
        }
        .welcome-inner { width: 100%; max-width: 960px; }
        .welcome-hero { text-align: center; margin-bottom: 40px; }
        .hub-icon {
            width: 60px; height: 60px; border-radius: 18px;
            background: var(--amber); display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(224,172,44,.3);
        }
        .hub-icon .material-symbols-outlined { font-size: 28px; color: #241a00; font-variation-settings: 'FILL' 1; }
        .welcome-title { font-size: 1.6rem; font-weight: 800; color: var(--gold); letter-spacing: -.02em; margin-bottom: 8px; }
        .welcome-sub { font-size: .9rem; color: var(--text3); max-width: 420px; margin: 0 auto; line-height: 1.6; }
        .tools-section-label {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--text3); margin-bottom: 12px;
            padding-left: 2px;
        }
        .tools-group { margin-bottom: 32px; }
        .tools-grid { display: grid; gap: 12px; grid-template-columns: repeat(5, 1fr); }
        @media (max-width: 1024px) { .tools-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 640px)  { .tools-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 400px)  { .tools-grid { grid-template-columns: 1fr; } }
        .tool-card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px; cursor: pointer;
            text-align: left; font-family: inherit; width: 100%;
            transition: border-color .15s, background .15s, transform .15s;
        }
        .tool-card:hover { border-color: var(--amber); background: var(--bg3); transform: translateY(-2px); }
        .tool-card-icon {
            width: 36px; height: 36px; border-radius: 10px;
            background: var(--bg3); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px;
        }
        .tool-card-icon .material-symbols-outlined { font-size: 18px; color: var(--amber); }
        .tool-card-name { font-size: .82rem; font-weight: 700; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
        .tool-card-desc { font-size: .7rem; color: var(--text3); line-height: 1.4; }
        .welcome-hint { font-size: .72rem; color: var(--text3); text-align: center; margin-top: 8px; }

        /* Iframe area */
        #iframe-wrap {
            position: absolute; inset: 0; display: none; flex-direction: column; z-index: 5;
        }
        iframe {
            flex: 1; border: none; background: var(--bg);
            width: 100%; display: block;
        }
        #iframe-loader {
            position: absolute; inset: 0;
            background: rgba(13,15,23,.9); display: flex;
            align-items: center; justify-content: center;
            z-index: 20; transition: opacity .2s; opacity: 0; pointer-events: none;
        }
        .spinner {
            width: 36px; height: 36px; border-radius: 50%;
            border: 3px solid var(--border); border-top-color: var(--amber);
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-label { font-size: 12px; color: var(--text3); margin-top: 12px; }

        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 400; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; word-wrap: normal; -webkit-font-smoothing: antialiased; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
    </style>
</head>
<body>

<!-- Topbar unificada -->
<header class="topbar">
    <div class="topbar-left">
        <div class="pbf-badge">PBF</div>
        <span class="topbar-title">Hub Financeiro</span>
        <button class="topbar-back-btn" id="backBtnIntegrated" style="display: none;">
            <span class="material-symbols-outlined">arrow_back</span>
            <span>Voltar ao início</span>
        </button>
    </div>
    <div class="topbar-center">
        <span id="activeToolNameDisplay" class="active-tool-name" style="display: none;"></span>
    </div>
    <div class="topbar-right">
        <button class="topbar-new-btn" id="newTabBtnIntegrated" style="display: none;">
            <span class="material-symbols-outlined">open_in_new</span>
            <span>Nova aba</span>
        </button>
        <span class="topbar-clock" id="topClock"></span>
        <button class="theme-btn" id="themeBtn">🌙</button>
    </div>
</header>

<div class="layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <!-- SIDEBAR EXATAMENTE COMO O PRINT: MENU, Início, Ferramentas, Consultas, rodapé -->
    <aside class="sidebar" id="sidebar">
        <!-- Título MENU -->
        <div class="nav-section-label" style="margin-top: 8px;">MENU</div>
        
        <!-- Item Início -->
        <button class="nav-item active" data-name="home" data-label="Início" data-url="">
            <span class="material-symbols-outlined">home</span>
            <span class="nav-item-label">Início</span>
        </button>

        <!-- Seção FERRAMENTAS -->
        <div class="nav-section-label">FERRAMENTAS</div>
        <button class="nav-item" data-name="carteiras" data-label="Carteira Recomendada" data-url="https://pabloads2020-lang.github.io/Carteiras-recomendadas/">
            <span class="material-symbols-outlined">account_balance_wallet</span>
            <span class="nav-item-label">Carteira Recomendada</span>
        </button>
        <button class="nav-item" data-name="rebalanceamento" data-label="Rebalanceamento" data-url="https://pabloads2020-lang.github.io/Rebalanceamento-2/">
            <span class="material-symbols-outlined">balance</span>
            <span class="nav-item-label">Rebalanceamento</span>
        </button>
        <button class="nav-item" data-name="extrato" data-label="Extrato Analítico" data-url="https://pabloads2020-lang.github.io/Extrato-Analitico/">
            <span class="material-symbols-outlined">receipt_long</span>
            <span class="nav-item-label">Extrato Analítico</span>
        </button>
        <button class="nav-item" data-name="relatorio" data-label="Relatório Mensal" data-url="https://pabloads2020-lang.github.io/Relatorio-mensal/">
            <span class="material-symbols-outlined">description</span>
            <span class="nav-item-label">Relatório Mensal</span>
        </button>
        <button class="nav-item" data-name="ips" data-label="Gerador IPS" data-url="https://pabloads2020-lang.github.io/IPS/">
            <span class="material-symbols-outlined">assignment_turned_in</span>
            <span class="nav-item-label">Gerador IPS</span>
        </button>

        <!-- Seção CONSULTAS -->
        <div class="nav-section-label">CONSULTAS</div>
        <button class="nav-item" data-name="calendario" data-label="Calendário de Vencimentos" data-url="https://pabloads2020-lang.github.io/Calendario-de-Vencimentos/">
            <span class="material-symbols-outlined">calendar_month</span>
            <span class="nav-item-label">Calendário de Vencimentos</span>
        </button>
        <button class="nav-item" data-name="emissores" data-label="Emissores Bancários" data-url="https://pabloads2020-lang.github.io/Emissores-Bancarios/">
            <span class="material-symbols-outlined">account_balance</span>
            <span class="nav-item-label">Emissores Bancários</span>
        </button>
        <button class="nav-item" data-name="credito-privado" data-label="Crédito Privado" data-url="https://pabloads2020-lang.github.io/Credito-Privado/">
            <span class="material-symbols-outlined">credit_card</span>
            <span class="nav-item-label">Crédito Privado</span>
        </button>
        <button class="nav-item" data-name="fundos-aprovados" data-label="Fundos Aprovados" data-url="https://pabloads2020-lang.github.io/Fundos-Aprovados/">
            <span class="material-symbols-outlined">show_chart</span>
            <span class="nav-item-label">Fundos Aprovados</span>
        </button>

        <!-- Rodapé -->
        <div class="sidebar-footer">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1Yh2vkLWrOQ89P0Z9tbaVWCYK-fpN09-euyU64ttgORw8cMgmmSgaDwbyS9UvG8ngrUVJgIntrMtOxnBYCBr1hAPkYQm2xUNrLsdI0hJb0I7Vjz1kgelN8b-IjTJHeuX8xLitouyZumU1cDb_5qciKeK8RKA0Cx3xVCCjv8C-iufLhbYahgAcI3Dkg2cXaQYUYbnnzeEsCQNUhqqYkTG3vsN9QMIX7ji7QQb4eTairjx02qTNg6dHVCLQO6PX3JONpAieSsBYMxulGQ" alt="Pablo B. Freire">
            <div class="user-info">
                <div class="user-name">Pablo B. Freire</div>
                <div class="user-role">Criador</div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div id="welcome-screen">
            <div class="welcome-inner">
                <div class="welcome-hero">
                    <div class="hub-icon"><span class="material-symbols-outlined">hub</span></div>
                    <h2 class="welcome-title">Hub Financeiro</h2>
                    <p class="welcome-sub">Painel centralizado de ferramentas para análise, rebalanceamento e planejamento de investimentos.</p>
                </div>
                <div class="tools-group">
                    <div class="tools-section-label">Ferramentas</div>
                    <div class="tools-grid">
                        <button class="tool-card" data-target="carteiras"><div class="tool-card-icon"><span class="material-symbols-outlined">account_balance_wallet</span></div><div class="tool-card-name">Carteira Recomendada</div><div class="tool-card-desc">Visualize a alocação ideal por perfil de investidor.</div></button>
                        <button class="tool-card" data-target="rebalanceamento"><div class="tool-card-icon"><span class="material-symbols-outlined">balance</span></div><div class="tool-card-name">Rebalanceamento</div><div class="tool-card-desc">Calcule os ajustes necessários para reequilibrar a carteira.</div></button>
                        <button class="tool-card" data-target="extrato"><div class="tool-card-icon"><span class="material-symbols-outlined">receipt_long</span></div><div class="tool-card-name">Extrato Analítico</div><div class="tool-card-desc">Analise os extratos e movimentações da carteira.</div></button>
                        <button class="tool-card" data-target="relatorio"><div class="tool-card-icon"><span class="material-symbols-outlined">description</span></div><div class="tool-card-name">Relatório Mensal</div><div class="tool-card-desc">Gere relatórios consolidados de desempenho mensal.</div></button>
                        <button class="tool-card" data-target="ips"><div class="tool-card-icon"><span class="material-symbols-outlined">assignment_turned_in</span></div><div class="tool-card-name">Gerador IPS</div><div class="tool-card-desc">Crie a Política de Investimentos do cliente automaticamente.</div></button>
                    </div>
                </div>
                <div class="tools-group">
                    <div class="tools-section-label">Consultas</div>
                    <div class="tools-grid">
                        <button class="tool-card" data-target="calendario"><div class="tool-card-icon"><span class="material-symbols-outlined">calendar_month</span></div><div class="tool-card-name">Calendário de Vencimentos</div><div class="tool-card-desc">Acompanhe vencimentos e envie lembretes via WhatsApp.</div></button>
                        <button class="tool-card" data-target="emissores"><div class="tool-card-icon"><span class="material-symbols-outlined">account_balance</span></div><div class="tool-card-name">Emissores Bancários</div><div class="tool-card-desc">Consulte ratings, scores e indicadores financeiros.</div></button>
                        <button class="tool-card" data-target="credito-privado"><div class="tool-card-icon"><span class="material-symbols-outlined">credit_card</span></div><div class="tool-card-name">Crédito Privado</div><div class="tool-card-desc">Ativos de crédito privado, debêntures e CRI/CRA.</div></button>
                        <button class="tool-card" data-target="fundos-aprovados"><div class="tool-card-icon"><span class="material-symbols-outlined">show_chart</span></div><div class="tool-card-name">Fundos Aprovados</div><div class="tool-card-desc">Fundos aprovados pelo comitê de alocações.</div></button>
                    </div>
                </div>
                <p class="welcome-hint">Selecione uma ferramenta acima ou pelo menu lateral</p>
            </div>
        </div>

        <div id="iframe-wrap">
            <div id="iframe-loader">
                <div style="text-align:center;"><div class="spinner"></div><div class="loader-label">Carregando...</div></div>
            </div>
            <iframe id="content-frame" src="about:blank" title="Ferramenta"></iframe>
        </div>
    </main>
</div>

<script>
    const APPS = {
        carteiras:         { url: "https://pabloads2020-lang.github.io/Carteiras-recomendadas/",    label: "Carteira Recomendada" },
        rebalanceamento:   { url: "https://pabloads2020-lang.github.io/Rebalanceamento-2/",         label: "Rebalanceamento" },
        extrato:           { url: "https://pabloads2020-lang.github.io/Extrato-Analitico/",         label: "Extrato Analítico" },
        relatorio:         { url: "https://pabloads2020-lang.github.io/Relatorio-mensal/",          label: "Relatório Mensal" },
        ips:               { url: "https://pabloads2020-lang.github.io/IPS/",                       label: "Gerador IPS" },
        calendario:        { url: "https://pabloads2020-lang.github.io/Calendario-de-Vencimentos/", label: "Calendário de Vencimentos" },
        emissores:         { url: "https://pabloads2020-lang.github.io/Emissores-Bancarios/",       label: "Emissores Bancários" },
        "credito-privado": { url: "https://pabloads2020-lang.github.io/Credito-Privado/",           label: "Crédito Privado" },
        "fundos-aprovados":{ url: "https://pabloads2020-lang.github.io/Fundos-Aprovados/",          label: "Fundos Aprovados" },
    };

    let currentApp = null;
    let loadTimeout = null;
    const iframe = document.getElementById('content-frame');
    const loader = document.getElementById('iframe-loader');
    const iframeWrap = document.getElementById('iframe-wrap');
    const welcome = document.getElementById('welcome-screen');
    const backBtn = document.getElementById('backBtnIntegrated');
    const toolNameSpan = document.getElementById('activeToolNameDisplay');
    const newTabBtn = document.getElementById('newTabBtnIntegrated');
    const navItems = document.querySelectorAll('.nav-item');

    function setActive(name) {
        navItems.forEach(b => b.classList.toggle('active', b.dataset.name === name));
    }

    function showHome() {
        if (currentApp === 'home') return;
        currentApp = 'home';
        iframe.src = 'about:blank';
        iframeWrap.style.display = 'none';
        welcome.style.display = 'flex';
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        backBtn.style.display = 'none';
        toolNameSpan.style.display = 'none';
        newTabBtn.style.display = 'none';
        setActive('home');
        localStorage.removeItem('lastApp');
    }

    function loadApp(name) {
        if (currentApp === name) return;
        const app = APPS[name];
        if (!app) return;
        currentApp = name;
        welcome.style.display = 'none';
        iframeWrap.style.display = 'flex';
        loader.style.opacity = '1';
        loader.style.pointerEvents = 'auto';
        iframe.style.opacity = '0.4';
        toolNameSpan.textContent = app.label;
        toolNameSpan.style.display = 'inline-block';
        backBtn.style.display = 'inline-flex';
        newTabBtn.style.display = 'inline-flex';
        newTabBtn.onclick = () => window.open(app.url, '_blank');
        backBtn.onclick = () => showHome();
        if (loadTimeout) clearTimeout(loadTimeout);
        loadTimeout = setTimeout(() => {
            loader.style.opacity = '0';
            loader.style.pointerEvents = 'none';
            iframe.style.opacity = '1';
        }, 12000);
        iframe.src = app.url;
        setActive(name);
        localStorage.setItem('lastApp', name);
        closeMobileSidebar();
    }

    iframe.onload = () => {
        if (loadTimeout) clearTimeout(loadTimeout);
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        iframe.style.opacity = '1';
    };

    navItems.forEach(btn => {
        btn.addEventListener('click', () => {
            const name = btn.dataset.name;
            if (name === 'home') showHome();
            else loadApp(name);
        });
    });
    document.querySelectorAll('.tool-card').forEach(card => {
        card.addEventListener('click', () => loadApp(card.dataset.target));
    });

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    function closeMobileSidebar() { sidebar.classList.remove('mobile-open'); overlay.style.display = 'none'; }
    overlay.addEventListener('click', closeMobileSidebar);

    function updateClock() {
        const el = document.getElementById('topClock');
        if (el) {
            const now = new Date();
            el.textContent = now.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short', year:'numeric'}) + ' · ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        }
    }
    updateClock(); setInterval(updateClock, 1000);

    let isDark = true;
    document.getElementById('themeBtn').addEventListener('click', () => {
        isDark = !isDark;
        document.body.classList.toggle('light', !isDark);
        document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
    });
    showHome();
</script>
</body>
</html>
